name: Build and Push Docker Image on Release

on:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: write      # 更新 release notes 需要
      packages: write      # 推送镜像到 GHCR 需要

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate image digest info
        id: digest_info
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_REF="${{ env.REGISTRY }}/${REPO_LOWER}:${VERSION}"
          DIGEST="${{ steps.build.outputs.digest }}"

          echo "image_ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Update release notes with Docker image info
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: release } = await github.rest.repos.getRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: context.payload.release.id,
            });

            const version = context.payload.release.tag_name;
            const repoLower = context.repo.owner.toLowerCase() + '/' + context.repo.repo.toLowerCase();
            const registry = '${{ env.REGISTRY }}';
            const imageRef = `${registry}/${repoLower}:${version}`;
            const digest = '${{ steps.build.outputs.digest }}';

            const tableRows = [
              '| 属性 | 值 |',
              '|------|-----|',
              '| 镜像地址 | `' + imageRef + '` |',
              '| Digest | `' + digest + '` |',
            ].join('\n');

            const pullCommands = [
              'docker pull ' + imageRef,
              '# 或通过 digest 拉取（推荐，确保内容一致）',
              'docker pull ' + registry + '/' + repoLower + '@' + digest,
            ].join('\n');

            const dockerSection = '\n\n## Docker Image\n\n' +
              tableRows + '\n\n' +
              '**拉取镜像：**\n' +
              '```bash\n' + pullCommands + '\n```\n';

            const existingBody = release.body || '';
            const updatedBody = existingBody + dockerSection;

            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              body: updatedBody,
            });

            core.info(`Release notes updated with Docker image: ${imageRef}`);
